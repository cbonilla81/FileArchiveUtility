name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore FolderArchiveTool/FolderArchiveTool.csproj -r win-x64 || true
      - name: Build
        run: |
          dotnet build FolderArchiveTool/FolderArchiveTool.csproj -c Release -r win-x64 --no-restore
      - name: Test
        run: |
          dotnet test FolderArchiveTool.Tests/FolderArchiveTool.Tests.csproj -c Release --no-build --verbosity normal

      - name: Install WiX Toolset (for MSI build)
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = "$env:ProgramFiles(x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path $wixBin)) { $wixBin = "$env:ProgramFiles(x86)\WiX Toolset v3.11\bin" }
          if (-not (Test-Path $wixBin)) { $wixBin = "$env:ProgramFiles\WiX Toolset v3.14\bin" }
          if (-not (Test-Path $wixBin)) { $wixBin = "$env:ProgramFiles\WiX Toolset v3.11\bin" }
          if (Test-Path $wixBin) {
            $env:Path = "$wixBin;$env:Path"
            Write-Host "Added WiX bin to PATH: $wixBin"
          }
          Get-Command heat.exe | Format-Table -AutoSize
          Get-Command candle.exe | Format-Table -AutoSize
          Get-Command light.exe | Format-Table -AutoSize

      - name: Build MSI
        shell: pwsh
        run: |
          Set-Location ${{ github.workspace }}
          .\Installer\build_msi.ps1 -OutputMsi "FolderArchiveTool.msi" -Configuration Release -Runtime win-x64

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: FolderArchiveTool-msi
          path: FolderArchiveTool.msi
